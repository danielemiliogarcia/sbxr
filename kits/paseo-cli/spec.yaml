# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
version: "0.8.0"
displayName: Paseo agent-control daemon
description: Adds the pinned Paseo CLI and a local-only daemon that Paseo clients reach over the sandbox SSH transport.
sourceUrl: https://www.npmjs.com/package/@getpaseo/cli

capabilities:
  # sbxr installs the committed-lockfile Node package after creation, in the runtime phase.
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - registry.npmjs.org:443
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            mkdir -p /home/agent/.paseo
            chown -R agent:agent /home/agent/.paseo
          user: "0"
          description: Make the persistent Paseo state volume agent-owned
        - command: |
            set -euo pipefail
            mkdir -p /home/agent/.paseo
            if [ ! -f /home/agent/.paseo/config.json ]; then
              cat > /home/agent/.paseo/config.json <<'PASEO_CONFIG'
            {
              "version": 1,
              "daemon": {
                "listen": "127.0.0.1:6767",
                "relay": { "enabled": false },
                "cors": { "allowedOrigins": ["https://app.paseo.sh"] }
              },
              "app": { "baseUrl": "https://app.paseo.sh" }
            }
            PASEO_CONFIG
              chmod 0600 /home/agent/.paseo/config.json
            fi
          user: agent
          description: Bind the daemon to sandbox loopback and disable the external relay
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.paseo
      size: 4g
