schemaVersion: "2"
kind: mixin
name: browser
version: "0.0.83"
displayName: Playwright browser MCP
description: Adds a lockfile-pinned, isolated Chromium MCP server for supported coding agents.
sourceURL: https://github.com/microsoft/playwright-mcp

security:
  privileged: false

permissions:
  network:
    allow:
      - registry.npmjs.org:443
      - cdn.playwright.dev:443
      - playwright.download.prss.microsoft.com:443
      - archive.ubuntu.com:80
      - security.ubuntu.com:80
      - ports.ubuntu.com:80
      - download.docker.com:443

volumes:
  - path: /home/agent/.cache/ms-playwright
    size: 4g
