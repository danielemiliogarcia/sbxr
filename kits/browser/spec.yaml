# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
version: "0.0.83"
displayName: Playwright browser MCP
description: Adds a lockfile-pinned, isolated Chromium MCP server for supported coding agents.
sourceUrl: https://github.com/microsoft/playwright-mcp

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - registry.npmjs.org:443
          - cdn.playwright.dev:443
          - playwright.download.prss.microsoft.com:443
          - deb.debian.org
          - dhi.io
          - download.docker.com:443
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.cache/ms-playwright
      size: 4g
