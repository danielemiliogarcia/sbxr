schemaVersion: "2"
kind: sandbox
name: sbxr-multi-agent
version: "2.1.239"
displayName: sbxr Codex + Claude agent
description: Extends Docker's Codex agent with pinned Claude Code and host-managed Claude subscription OAuth.
sourceURL: https://github.com/anthropics/claude-code
extends: codex

security:
  privileged: false

permissions:
  network:
    allow:
      - registry.npmjs.org:443
      - api.anthropic.com:443
      - console.anthropic.com:443
      - claude.ai:443
      - platform.claude.com:443
      - downloads.claude.ai:443
      - claude.com:443
      - mcp-proxy.anthropic.com:443
      - bridge.claudeusercontent.com:443
      - api.github.com:443
      - github.com:443
      - release-assets.githubusercontent.com:443

credentials:
  - service: github
    description: GitHub HTTPS and API token kept behind the Docker host proxy
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer
        - domain: github.com
          scheme: basic
          username: x-access-token
  - service: anthropic
    description: Claude subscription OAuth kept behind the Docker host proxy
    oauth:
      tokenEndpoint:
        host: platform.claude.com
        path: /v1/oauth/token
      resourceHosts:
        - api.anthropic.com
      sentinels:
        accessToken: sk-ant-oat01-proxy-managed
        refreshToken: sk-ant-ort01-proxy-managed
      credentialFile:
        path: "~/.claude/.credentials.json"
        template: |
          {"claudeAiOauth":{"accessToken":"{{.AccessToken}}","refreshToken":"{{.RefreshToken}}","expiresAt":{{.ExpiresAt}},"scopes":{{.ScopesJSON}}}}

environment:
  variables:
    IS_SANDBOX: "1"
    DISABLE_AUTOUPDATER: "1"

setup:
  install:
    - command: |
        set -euo pipefail
        mkdir -p \
          /home/agent/.claude/projects \
          /home/agent/.claude/sessions \
          /home/agent/.claude/todos \
          /home/agent/.claude/shell-snapshots \
          /home/agent/.claude/statsig
        chown -R agent:agent /home/agent/.claude
      user: "0"
      description: Make the persistent Claude configuration and session volume agent-owned

    - command: |
        set -euo pipefail
        ws="${WORKSPACE_DIR:-/}"
        esc=$(printf '%s' "$ws" | sed 's/\\/\\\\/g; s/"/\\"/g; s/\t/\\t/g; s/\r/\\r/g')
        projects='"/": { "hasTrustDialogAccepted": true }'
        if [ "$ws" != / ]; then
          projects="$projects, \"$esc\": { \"hasTrustDialogAccepted\": true }"
        fi
        printf '%s\n' "{
          \"bypassPermissionsModeAccepted\": true,
          \"hasCompletedOnboarding\": true,
          \"projects\": { $projects }
        }" > /home/agent/.claude.json
        chown agent:agent /home/agent/.claude.json
        chmod 0600 /home/agent/.claude.json
      user: "0"
      description: Seed Claude onboarding and workspace trust flags

    - command: |
        set -euo pipefail
        mkdir -p /home/agent/.claude
        printf '%s\n' "{
          \"themeId\": 1,
          \"alwaysThinkingEnabled\": true,
          \"defaultMode\": \"bypassPermissions\",
          \"bypassPermissionsModeAccepted\": true
        }" > /home/agent/.claude/settings.json
        chmod 0600 /home/agent/.claude/settings.json
      user: "1000"
      description: Seed Claude settings without an API-key helper

volumes:
  - path: /home/agent/.claude
    size: 4g
