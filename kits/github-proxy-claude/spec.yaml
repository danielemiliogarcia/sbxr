schemaVersion: "2"
kind: sandbox
name: sbxr-claude-github
version: "1.0.0"
displayName: sbxr Claude + GitHub proxy
description: Extends Docker Claude with host-proxied GitHub HTTPS and API authentication.
sourceURL: https://github.com/danielemiliogarcia/sbxr
extends: claude

security:
  privileged: false

permissions:
  network:
    allow:
      - api.github.com:443
      - github.com:443
      - release-assets.githubusercontent.com:443

credentials:
  - service: github
    description: GitHub token kept behind the Docker host proxy
    apiKey:
      name: GH_TOKEN
      proxyManaged: true
      inject:
        - domain: api.github.com
          scheme: bearer
        - domain: github.com
          scheme: basic
          username: x-access-token
