# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
version: "2.1.0"
displayName: Host shell environment hook
description: Sources the profile-selected, host-mirrored shell overlay without selecting a login shell.
sourceUrl: https://github.com/danielemiliogarcia/sbxr

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            mkdir -p /home/agent/.config/sbxr
            cat > /home/agent/.config/sbxr/host-shell.bash <<'SBXR_HOST_SHELL'
            # Managed by sbxr. This file is safe to source more than once.
            # The launcher writes this file from the protected nonsecret shell
            # profile. Host configuration and credentials are never kit inputs.
            if [ -f "$HOME/.config/sbxr/host-shell-runtime.bash" ]; then
              . "$HOME/.config/sbxr/host-shell-runtime.bash" || true
            fi
            SBXR_HOST_SHELL
            touch /home/agent/.bashrc
            if ! grep -Fq '.config/sbxr/host-shell.bash' /home/agent/.bashrc; then
              printf '%s\n' \
                '' \
                '# sbxr mirrored host shell environment' \
                '[ -f "$HOME/.config/sbxr/host-shell.bash" ] && . "$HOME/.config/sbxr/host-shell.bash"' \
                >> /home/agent/.bashrc
            fi
            chown -R agent:agent /home/agent/.config/sbxr /home/agent/.bashrc
          user: "0"
          description: Source the selected host-mirrored overlay
