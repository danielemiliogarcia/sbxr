# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
version: "1.4.247"
displayName: Orca remote server
description: Adds the optional checksum-pinned Orca headless runtime for connection from Orca Desktop.
sourceUrl: https://github.com/stablyai/orca

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - github.com:443
          - release-assets.githubusercontent.com:443
          - objects.githubusercontent.com:443
          - deb.debian.org
          - dhi.io
          - download.docker.com:443
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.config/orca
      size: 2g
  - type: com.docker.sandbox/volume@1
    config:
      path: /home/agent/.local/share/orca
      size: 8g
