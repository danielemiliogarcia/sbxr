schemaVersion: "2"
kind: mixin
name: codex-cli
version: "0.149.0"
displayName: OpenAI Codex CLI
description: Adds the pinned Codex CLI with persistent native ChatGPT subscription authentication.
sourceURL: https://github.com/openai/codex

security:
  privileged: false

permissions:
  network:
    allow:
      - registry.npmjs.org:443
      - api.openai.com:443
      - openai.com:443
      - auth.openai.com:443
      - chatgpt.com:443
      - www.chatgpt.com:443

environment:
  variables:
    BROWSER: xdg-open
    CODEX_HOME: /home/agent/.codex
    GIT_TERMINAL_PROMPT: "0"

setup:
  install:
    - command: |
        set -euo pipefail
        mkdir -p /home/agent/.codex/sessions
        chown -R agent:agent /home/agent/.codex
      user: "0"
      description: Make the persistent Codex configuration and session volume agent-owned

    - command: |
        set -euo pipefail
        if [ -n "${HTTP_PROXY:-}" ]; then npm config set proxy "$HTTP_PROXY"; fi
        if [ -n "${HTTPS_PROXY:-}" ]; then npm config set https-proxy "$HTTPS_PROXY"; fi
        if ! codex --version 2>/dev/null | grep -Fq '0.149.0'; then
          npm install -g --include=optional --no-audit --no-fund @openai/codex@0.149.0
        fi
        PREFIX=$(npm config get prefix)
        REAL="$PREFIX/lib/node_modules/@openai/codex/bin/codex.js"
        SHIM="$PREFIX/bin/codex"
        test -x "$REAL"
        rm -f "$SHIM"
        printf '%s\n' \
          '#!/bin/sh' \
          '# The shell base injects an API-key proxy binding. This mixin is' \
          '# subscription-only, so native ChatGPT OAuth must take precedence.' \
          'unset OPENAI_API_KEY OPENAI_BASE_URL OPENAI_API_BASE SBX_CRED_OPENAI_MODE' \
          "exec \"$REAL\" \"\$@\"" > "$SHIM"
        chmod 0755 "$SHIM"
        codex --version
      user: "1000"
      description: Install pinned Codex and isolate it from the shell API-key proxy

    - command: |
        set -euo pipefail
        mkdir -p /home/agent/.codex
        chmod 0700 /home/agent/.codex
        cat > /home/agent/.codex/config.toml <<'EOF'
        # Managed by the Docker Sandbox codex-cli mixin.
        approval_policy = "never"
        sandbox_mode = "danger-full-access"
        forced_login_method = "chatgpt"
        cli_auth_credentials_store = "file"
        mcp_oauth_credentials_store = "file"
        EOF
      user: "1000"
      description: Require ChatGPT login and file-backed OAuth persistence

volumes:
  - path: /home/agent/.codex
    size: 2g
