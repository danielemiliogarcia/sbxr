[package]
name = "sbxr"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Project-scoped Rust development sandboxes for Docker Sandboxes"
license = "Apache-2.0"
publish = false

[dependencies]
serde_json = "=1.0.151"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
